[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-netscan"
version = "0.1.0"
description = "Safe network discovery, risk recommendations, and mapping for NetBox"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Armando Guerra"}]
dependencies = []

[tool.setuptools.packages.find]
include = ["netbox_netscan*"]

[tool.setuptools.package-data]
netbox_netscan = ["templates/**/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

