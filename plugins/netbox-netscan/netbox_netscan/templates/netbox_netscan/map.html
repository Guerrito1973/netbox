{% extends 'base/layout.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3"><div><h1>Network map</h1><p class="text-secondary">Select a device to open its discovery record.</p></div><a class="btn btn-outline-secondary" href="{% url 'plugins:netbox_netscan:dashboard' %}">Back</a></div>
<div class="card"><div class="card-body p-0"><svg id="network-map" viewBox="0 0 1200 700" role="img" aria-label="Discovered network topology" style="width:100%;min-height:650px;background:var(--tblr-bg-surface-secondary)"></svg></div></div>
{{ graph|json_script:"network-graph" }}
<script>
(() => {
  const graph = JSON.parse(document.getElementById('network-graph').textContent);
  const svg = document.getElementById('network-map');
  const NS = 'http://www.w3.org/2000/svg';
  const networks = graph.nodes.filter(n => n.kind === 'network');
  const hosts = graph.nodes.filter(n => n.kind !== 'network');
  const positions = new Map();
  networks.forEach((network, i) => {
    const x = 150 + i * Math.max(260, 900 / Math.max(networks.length, 1));
    const y = 100;
    positions.set(network.id, {x, y});
    const children = graph.links.filter(link => link.source === network.id);
    children.forEach((link, j) => positions.set(link.target, {x: x + ((j % 3) - 1) * 90, y: 230 + Math.floor(j / 3) * 105}));
  });
  const el = (name, attrs) => { const node = document.createElementNS(NS, name); Object.entries(attrs).forEach(([k,v]) => node.setAttribute(k,v)); return node; };
  graph.links.forEach(link => { const a=positions.get(link.source), b=positions.get(link.target); if(a&&b) svg.appendChild(el('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:'#94a3b8','stroke-width':2})); });
  graph.nodes.forEach(node => {
    const p=positions.get(node.id); if(!p) return;
    const group=el('g',{tabindex:0,style:node.url?'cursor:pointer':''});
    const color=node.kind==='network'?'#206bc4':node.risk>=70?'#d63939':node.risk>=40?'#f59f00':node.risk>=20?'#4299e1':'#2fb344';
    group.appendChild(el(node.kind==='network'?'rect':'circle',node.kind==='network'?{x:p.x-65,y:p.y-30,width:130,height:60,rx:10,fill:color}:{cx:p.x,cy:p.y,r:31,fill:color}));
    const label=el('text',{x:p.x,y:p.y+(node.kind==='network'?5:52),'text-anchor':'middle',fill:node.kind==='network'?'white':'currentColor','font-size':14}); label.textContent=node.label; group.appendChild(label);
    const title=el('title',{}); title.textContent=node.ip?`${node.ip} | ${node.kind} | risk ${node.risk}/100 | last seen ${node.last_seen}`:node.label; group.appendChild(title);
    if(node.url) group.addEventListener('click',()=>window.location.assign(node.url));
    svg.appendChild(group);
  });
})();
</script>
{% endblock %}
